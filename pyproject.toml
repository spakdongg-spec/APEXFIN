[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "apexfin"
version = "0.1.0"
description = "A forkable financial data engineering reference skeleton: medallion layers, five-layer architecture, fail-loud quality gate, static HTML dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "APEXFIN contributors" }]
keywords = ["data-engineering", "data-quality", "medallion", "sqlite", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.2.0,<3",
    "pyyaml>=6.0.1,<7",
    "jinja2>=3.1.4,<4",
    "httpx>=0.27.0,<1",
    "tenacity>=8.3.0,<10",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
apexfin = "apexfin.cli.app:main"

[project.urls]
Homepage = "https://github.com/apexfin/apexfin"
Source = "https://github.com/apexfin/apexfin"

[tool.hatch.build.targets.wheel]
packages = ["src/apexfin"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "apexfin/_bundled_config"

[tool.hatch.build.targets.sdist]
include = ["src/apexfin", "config", "tests", "docs", "Makefile", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "BLE",  # blind except
    "S",    # bandit subset
    "PTH",  # use pathlib
    "DTZ",  # naive datetime
]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "RUF001", # ambiguous unicode in Chinese strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "PTH", "DTZ001"]
"src/apexfin/core/clock.py" = ["DTZ005"]
"src/apexfin/cli/*" = ["B008"]  # typer.Option(...) in argument defaults is the documented Typer pattern

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["apexfin"]

[[tool.mypy.overrides]]
module = ["structlog.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
